replicas: 3

nodeSelector:
  nodetype: elasticsearch

podAntiAffinity:
  requiredDuringSchedulingIgnoredDuringExecution:
    - labelSelector:
        matchLabels:
          app: elasticsearch
      topologyKey: kubernetes.io/hostname

persistence:
  enabled: true
  size: 20Gi
  storageClass: standard

resources:
  requests:
    cpu: 1000m
    memory: 2Gi
  limits:
    cpu: 2000m
    memory: 4Gi

service:
  type: ClusterIP

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-staging
  hosts:
    - host: elasticsearch.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - elasticsearch.local
      secretName: elasticsearch-tls
